<section class="gallery-section">
  <div class="section-wrap-wide">
    <p class="eyebrow text-center">Momentos</p>
    <h2 class="text-center">Fragmentos de nosotros</h2>

    <div class="gallery-grid">
      @for (item of items(); track item.caption) {
        <figure class="polaroid">
          <div class="frame" [style.aspect-ratio]="item.width && item.height ? item.width + ' / ' + item.height : null">
            @if (item.src) {
              <img [ngSrc]="item.src" [alt]="item.alt ?? item.caption" [width]="item.width!" [height]="item.height!" />
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1" aria-hidden="true">
                <path
                  d="M12 20s-7-4.4-9.3-9C.9 7.1 3 4 6.2 4c1.9 0 3.4 1 5.8 3.3C14.4 5 15.9 4 17.8 4 21 4 23.1 7.1 21.3 11c-2.3 4.6-9.3 9-9.3 9z"
                />
              </svg>
            }
          </div>
          <figcaption>{{ item.caption }}</figcaption>
        </figure>
      }
    </div>
  </div>
</section>
