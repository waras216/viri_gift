<section class="map-section">
  <div class="section-wrap">
    <p class="eyebrow">Nuestro mapa</p>
    <h2>Los lugares que ya son nuestros</h2>
    <hr class="thread" />

    <ol class="route">
      @for (stop of stops(); track stop.name; let i = $index) {
        <li class="stop">
          <span class="pin" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
              <path
                d="M12 21s-6.5-5.8-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.2-6.5 11-6.5 11z"
              />
              <circle cx="12" cy="10" r="2.2" />
            </svg>
            <span class="pin-number">{{ i + 1 }}</span>
          </span>
          <div class="stop-copy">
            <h3>{{ stop.name }}</h3>
            <p>{{ stop.description }}</p>
          </div>
        </li>
      }
    </ol>
  </div>
</section>
